name: jahez-warehouse-intl

x-logging: &bounded-logging
  driver: local
  options:
    max-size: 10m
    max-file: "3"

services:
  postgres:
    cpus: 1.5
    mem_limit: 768m
    pids_limit: 256
    logging: *bounded-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]

  api:
    build: !reset null
    image: ${WAREHOUSE_IMAGE:?Set WAREHOUSE_IMAGE to the built release image}
    command: ["node", "apps/server/dist/main.js"]
    environment:
      MIGRATION_DATABASE_URL: !reset null
    ports:
      - "127.0.0.1:18744:3000"
    cpus: 1.0
    mem_limit: 640m
    pids_limit: 128
    logging: *bounded-logging

  worker:
    build: !reset null
    image: ${WAREHOUSE_IMAGE:?Set WAREHOUSE_IMAGE to the built release image}
    cpus: 1.0
    mem_limit: 768m
    pids_limit: 128
    logging: *bounded-logging

  nginx:
    profiles: [standalone-nginx]
