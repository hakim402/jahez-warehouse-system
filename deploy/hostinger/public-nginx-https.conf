map $http_upgrade $jahez_warehouse_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name office.jahez.online api.jahez.online;

    ssl_certificate /etc/letsencrypt/live/warehouse.jahez.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/warehouse.jahez.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 16m;

    location / {
        proxy_pass http://127.0.0.1:13080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $jahez_warehouse_upgrade;
        proxy_read_timeout 75s;
    }
}
