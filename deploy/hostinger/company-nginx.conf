server {
    listen 127.0.0.1:13080;
    server_name office.jahez.online;
    root /home/jahez/apps/jahez-warehouse-system/www/current;
    index index.html;

    include /home/jahez/services/nginx/snippets/jahez-warehouse-proxy.conf;

    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}

server {
    listen 127.0.0.1:13080;
    server_name api.jahez.online;

    include /home/jahez/services/nginx/snippets/jahez-warehouse-proxy.conf;

    location / {
        return 404;
    }
}
