server {
    listen 80;
    listen [::]:80;
    server_name office.jahez.online api.jahez.online;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/jahez-warehouse-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
